<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LANTERN — HTML · CSS · JS</title>
<style>
  :root{
    --bg:#ece5d6;
    --chrome-bg:#fbf8f1;
    --chrome-text:#3a332b;
    --sidebar-bg:#1b1512;
    --sidebar-ink:#8d7f6e;
    --sidebar-ink-active:#fff7ea;
    --panel-bg:#f6f1e6;
    --panel-ink:#221c15;
    --panel-sub:#7d7263;
    --accent:#ff9a1f;
    --accent-glow:rgba(255,154,31,.55);
    --line:rgba(0,0,0,.08);
    --html-c:#e8590c;
    --css-c:#1971c2;
    --js-c:#eab308;
  }
  body[data-theme="dark"]{
    --bg:#14100d;
    --chrome-bg:#1e1813;
    --chrome-text:#e8ded0;
    --sidebar-bg:#120e0b;
    --panel-bg:#1b1512;
    --panel-ink:#f3ead9;
    --panel-sub:#9a8d7a;
    --line:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--panel-ink);
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  /* ---------- browser chrome bar ---------- */
  .chrome{
    display:flex;align-items:center;gap:16px;
    background:var(--chrome-bg);
    padding:12px 18px;
    border-bottom:1px solid var(--line);
    flex:0 0 auto;
  }
  .dots{display:flex;gap:7px;flex:0 0 auto}
  .dots span{width:12px;height:12px;border-radius:50%}
  .dots span:nth-child(1){background:#ff5f57}
  .dots span:nth-child(2){background:#febc2e}
  .dots span:nth-child(3){background:#28c840}
  .chrome-title{
    flex:1;text-align:center;font-weight:800;letter-spacing:.04em;
    font-size:15px;color:var(--chrome-text);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  .chrome-title .t-html{color:var(--html-c)}
  .chrome-title .t-css{color:var(--css-c)}
  .chrome-title .t-js{color:var(--js-c)}
  .chrome-right{
    display:flex;align-items:center;gap:12px;flex:0 0 auto;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12px;color:var(--panel-sub);
  }
  .theme-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:50%;
    border:1px solid var(--line);background:transparent;cursor:pointer;
    color:var(--chrome-text);
  }
  .theme-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .theme-btn .icon-sun{display:none}
  body[data-theme="dark"] .theme-btn .icon-sun{display:block}
  body[data-theme="dark"] .theme-btn .icon-moon{display:none}
  /* ---------- app ---------- */
  .app{flex:1;display:flex;min-height:0}
  .sidebar{
    position:relative;
    width:min(34%,340px);min-width:240px;
    background:var(--sidebar-bg);
    padding:26px 0;
    overflow:hidden;
    flex:0 0 auto;
  }
  .lantern-list{list-style:none;position:relative;z-index:2}
  .lantern-link{
    display:flex;align-items:center;gap:12px;
    padding:13px 20px 13px 56px;
    text-decoration:none;color:var(--sidebar-ink);
    font-size:15px;font-weight:500;
    position:relative;
    transition:color .35s;
    outline:none;
    cursor:pointer;
  }
  .lantern-link:focus-visible{box-shadow:inset 0 0 0 2px var(--accent);border-radius:8px}
  .lantern-link svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .lantern-label{transition:color .35s,text-shadow .35s}
  .dot{
    margin-left:auto;width:7px;height:7px;border-radius:50%;
    background:var(--accent);opacity:0;transform:scale(.4);
    transition:opacity .3s,transform .3s;
    box-shadow:0 0 10px 2px var(--accent-glow);
    flex:0 0 auto;
  }
  .lantern-link[aria-current="page"]{color:var(--sidebar-ink-active)}
  .lantern-link[aria-current="page"] .dot{opacity:1;transform:scale(1)}
  /* ---------- the lantern ---------- */
  .lantern-rig{
    position:absolute;top:0;left:26px;width:0;height:120px;
    transform-origin:top center;
    transition:height .55s cubic-bezier(.22,1,.36,1);
    z-index:1;pointer-events:none;
  }
  .lantern-rig.swing{animation:swing 1.1s ease-out}
  @keyframes swing{
    0%{transform:rotate(0deg)}
    18%{transform:rotate(6deg)}
    42%{transform:rotate(-4.5deg)}
    65%{transform:rotate(2.5deg)}
    84%{transform:rotate(-1.2deg)}
    100%{transform:rotate(0deg)}
  }
  .cord{
    position:absolute;top:0;left:-1px;width:2px;height:100%;
    background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.55));
  }
  .halo{
    position:absolute;left:50%;bottom:-6px;transform:translate(-50%,50%);
    width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,166,32,.5) 0%,rgba(255,140,20,.18) 42%,transparent 68%);
    filter:blur(6px);
    pointer-events:none;
  }
  .lantern{
    position:absolute;left:50%;bottom:0;transform:translate(-50%,50%);
    width:30px;height:38px;
    filter:drop-shadow(0 0 10px rgba(255,160,40,.85)) drop-shadow(0 0 26px rgba(255,140,20,.45));
  }
  /* ---------- main panel ---------- */
  .panel{flex:1;background:var(--panel-bg);padding:64px 56px;min-width:0}
  .panel h1{font-size:clamp(34px,4.6vw,58px);font-weight:800;letter-spacing:-.02em;color:var(--panel-ink)}
  .panel p{margin-top:14px;font-size:clamp(16px,1.6vw,21px);color:var(--panel-sub)}
  .panel.swap h1,.panel.swap p{animation:rise .45s ease both}
  .panel.swap p{animation-delay:.06s}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .lantern-rig,.lantern-link,.lantern-label,.dot{transition:none !important}
    .lantern-rig.swing{animation:none !important}
    .panel.swap h1,.panel.swap p{animation:none !important}
  }
  @media (max-width:640px){
    .sidebar{min-width:200px}
    .panel{padding:40px 26px}
    .chrome-title{font-size:12px}
    .lantern-link{padding-left:48px}
  }
</style>
</head>
<body data-theme="light">

<header class="chrome">
  <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="chrome-title">LANTERN — <span class="t-html">HTML</span> · <span class="t-css">CSS</span> · <span class="t-js">JS</span></div>
  <div class="chrome-right">
    <span>localhost / lantern</span>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch to dark theme">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M20 13.5A8 8 0 1 1 10.5 4 6.5 6.5 0 0 0 20 13.5z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<div class="app">
  <nav class="sidebar" aria-label="Main">
    <div class="lantern-rig" id="lanternRig" aria-hidden="true">
      <div class="cord"></div>
      <div class="halo"></div>
      <svg class="lantern" viewBox="0 0 30 38">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ff8a00"/>
            <stop offset=".5" stop-color="#ffc233"/>
            <stop offset="1" stop-color="#ff8a00"/>
          </linearGradient>
        </defs>
        <rect x="12" y="0" width="6" height="3" rx="1" fill="#7c4a12"/>
        <path d="M6 6 Q15 2 24 6 L26 20 Q24 32 15 34 Q6 32 4 20 Z" fill="url(#lg)"/>
        <path d="M10 4.5 Q10 19 10 33.5 M15 3.5 Q15 19 15 34.5 M20 4.5 Q20 19 20 33.5" stroke="#e06e00" stroke-width="1" fill="none" opacity=".55"/>
        <rect x="12" y="34" width="6" height="2.6" rx="1" fill="#7c4a12"/>
        <path d="M13.5 37.5 h3" stroke="#c25700" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>
    <ul class="lantern-list" id="lanternList">
      <li><a class="lantern-link" href="#overview" data-page="overview" aria-current="page">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span class="lantern-label">Overview</span><span class="dot" aria-hidden="true"></span></a></li>
      <li><a class="lantern-link" href="#orders" data-page="orders">
        <svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
        <span class="lantern-label">Orders</span><span class="dot" aria-hidden="true"></span></a></li>
      <li><a class="lantern-link" href="#clients" data-page="clients">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.6c2.3.3 4.2 1.7 4.7 4.4"/></svg>
        <span class="lantern-label">Clients</span><span class="dot" aria-hidden="true"></span></a></li>
      <li><a class="lantern-link" href="#products" data-page="products">
        <svg viewBox="0 0 24 24"><path d="M20.6 13.4L11 3H4v7l9.6 10.4a2 2 0 0 0 2.8 0l4.2-4.2a2 2 0 0 0-2.8-2.8z"/><circle cx="8.5" cy="8.5" r="1.4"/></svg>
        <span class="lantern-label">Products</span><span class="dot" aria-hidden="true"></span></a></li>
      <li><a class="lantern-link" href="#reports" data-page="reports">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7"/><path d="M2 20h20"/></svg>
        <span class="lantern-label">Reports</span><span class="dot" aria-hidden="true"></span></a></li>
      <li><a class="lantern-link" href="#settings" data-page="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8"/></svg>
        <span class="lantern-label">Settings</span><span class="dot" aria-hidden="true"></span></a></li>
    </ul>
  </nav>

  <main class="panel" id="panel">
    <h1 id="pageTitle">Overview</h1>
    <p id="pageSub">Sales are up 12% this week.</p>
  </main>
</div>

<script>
(function(){
  "use strict";
  var pages = {
    overview:{ title:"Overview", sub:"Sales are up 12% this week." },
    orders:{ title:"Orders", sub:"32 orders to ship today, 4 running late." },
    clients:{ title:"Clients", sub:"3 new clients joined this week." },
    products:{ title:"Products", sub:"12 products are low on stock." },
    reports:{ title:"Reports", sub:"The weekly report is ready to send." },
    settings:{ title:"Settings", sub:"Your workspace is all set." }
  };
  var links = Array.prototype.slice.call(document.querySelectorAll(".lantern-link"));
  var rig = document.getElementById("lanternRig");
  var sidebar = document.querySelector(".sidebar");
  var panel = document.getElementById("panel");
  var pageTitle = document.getElementById("pageTitle");
  var pageSub = document.getElementById("pageSub");
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var active = 0;

  function rowCenter(i){
    var r = links[i].getBoundingClientRect();
    var s = sidebar.getBoundingClientRect();
    return r.top - s.top + r.height / 2;
  }
  function placeRig(i){ rig.style.height = rowCenter(i) + "px"; }

  function clamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }

  /* Glow falls off with distance from the lit row, like the original. */
  function setGlow(){
    links.forEach(function(link, i){
      var label = link.querySelector(".lantern-label");
      var d = Math.abs(i - active);
      var t = clamp(1 - d * 0.55, 0, 1);
      var g = Math.tanh(t * 3);
      if (i === active) {
        label.style.textShadow = "0 0 14px rgba(255,170,40,.9), 0 0 34px rgba(255,140,20,.45)";
      } else if (g > 0.02) {
        label.style.textShadow = "0 0 " + Math.round(10 * g) + "px rgba(255,160,40," + (0.5 * g).toFixed(2) + ")";
      } else {
        label.style.textShadow = "none";
      }
    });
  }

  function select(i, opts){
    opts = opts || {};
    if (i === active && !opts.force) return;
    active = i;
    links.forEach(function(l, j){
      if (j === i) l.setAttribute("aria-current", "page");
      else l.removeAttribute("aria-current");
    });
    placeRig(i);
    if (opts.swing !== false && !reduceMotion) {
      rig.classList.remove("swing");
      void rig.offsetWidth;
      rig.classList.add("swing");
    }
    setGlow();
    var p = pages[links[i].dataset.page];
    panel.classList.remove("swap");
    void panel.offsetWidth;
    pageTitle.textContent = p.title;
    pageSub.textContent = p.sub;
    panel.classList.add("swap");
    if (history.replaceState) history.replaceState(null, "", "#" + links[i].dataset.page);
  }

  links.forEach(function(link, i){
    link.addEventListener("click", function(e){
      e.preventDefault();
      select(i);
    });
  });

  document.getElementById("lanternList").addEventListener("keydown", function(e){
    var n = links.length, next = null;
    if (e.key === "ArrowDown") next = (active + 1) % n;
    else if (e.key === "ArrowUp") next = (active - 1 + n) % n;
    else if (e.key === "Home") next = 0;
    else if (e.key === "End") next = n - 1;
    if (next !== null) {
      e.preventDefault();
      select(next);
      links[next].focus();
    }
  });

  document.getElementById("themeBtn").addEventListener("click", function(){
    var dark = document.body.dataset.theme !== "dark";
    document.body.dataset.theme = dark ? "dark" : "light";
    this.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
  });

  window.addEventListener("resize", function(){ placeRig(active); });

  /* Start on the #hash page when one is present. */
  function init(){
    var hash = (location.hash || "").replace("#", "");
    var start = 0;
    links.forEach(function(l, i){ if (l.dataset.page === hash) start = i; });
    active = start;
    links.forEach(function(l, j){
      if (j === start) l.setAttribute("aria-current", "page");
      else l.removeAttribute("aria-current");
    });
    var p = pages[links[start].dataset.page];
    pageTitle.textContent = p.title;
    pageSub.textContent = p.sub;
    placeRig(start);
    setGlow();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
